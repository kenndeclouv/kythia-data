[package]
name = "kythia-data"
version = "0.1.1"
description = "Kythia Data is a modern, ultra-lightweight database client built as a sleek alternative to bloated, heavy tools like DBeaver, DataGrip, or web-based legacy tools like phpMyAdmin."
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.52.3", features = ["full"] }
sqlx = { version = "0.9.0", features = ["mysql", "runtime-tokio", "tls-rustls", "chrono"] }
chrono = "0.4.38"
futures = "0.3.32"
base64 = "0.22.1"
tauri-plugin-autostart = "2.5.1"

